function init() {
  filteredPapers = papersData;
  renderPapers();
  document.getElementById('searchBox').addEventListener('input', search);
}

function search(e) {
  const q = e.target.value.toLowerCase();
  if(!q) {
    filteredPapers = papersData;
  } else {
    filteredPapers = papersData.filter(p => 
      p.title.toLowerCase().includes(q) || 
      p.authors.toLowerCase().includes(q)
    );
  }
  currentPage = 1;
  renderPapers();
}

function renderPapers() {
  const list = document.getElementById('papersList');
  const total = filteredPapers.length;
  const totalPages = Math.ceil(total / PAPERS_PER_PAGE);
  const start = (currentPage - 1) * PAPERS_PER_PAGE;
  const end = Math.min(start + PAPERS_PER_PAGE, total);
  
  list.innerHTML = '';
  
  if(total === 0) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('paginationContainer').innerHTML = '';
    return;
  }
  
  document.getElementById('emptyState').style.display = 'none';
  
  for(let i = start; i < end; i++) {
    const p = filteredPapers[i];
    const li = document.createElement('li');
    li.className = 'paper-item';
    li.innerHTML = `
      <div class="paper-number">${(i+1).toString().padStart(2,'0')}</div>
      <div class="paper-content">
        <p class="paper-title">${p.title}</p>
        <p class="paper-authors">${p.authors}</p>
      </div>
    `;
    list.appendChild(li);
  }
  
  document.getElementById('startNum').textContent = start + 1;
  document.getElementById('endNum').textContent = end;
  
  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const container = document.getElementById('paginationContainer');
  container.innerHTML = '';
  
  if(totalPages <= 1) return;
  
  const prev = document.createElement('button');
  prev.className = 'page-btn';
  prev.textContent = '← Prev';
  prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; renderPapers(); };
  container.appendChild(prev);
  
  for(let i = 1; i <= totalPages; i++) {
    if(i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = () => { currentPage = i; renderPapers(); };
      container.appendChild(btn);
    } else if(i === 2 || i === totalPages - 1) {
      const dots = document.createElement('span');
      dots.textContent = '...';
      dots.style.padding = '8px 4px';
      container.appendChild(dots);
    }
  }
  
  const next = document.createElement('button');
  next.className = 'page-btn';
  next.textContent = 'Next →';
  next.disabled = currentPage === totalPages;
  next.onclick = () => { currentPage++; renderPapers(); };
  container.appendChild(next);
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('scroll', function() {
  const btn = document.getElementById('backToTop');
  if(btn) btn.classList.toggle('visible', window.scrollY > 300);
});
</script>
