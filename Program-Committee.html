<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Program Committee - ICDDS 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="img/favicon.ico" rel="icon">
  <link href="css/style-aiml.css" rel="stylesheet">
  <link href="vendor/font-awesome/css/font-awesome.min.css" rel="stylesheet">
  <style>
    .member-grid { columns: 2; column-gap: 32px; }
    .member-grid li { break-inside: avoid; padding: 6px 0; border-bottom: 1px solid var(--border); list-style: none; font-size: 0.93rem; }
    .member-grid li::before { content: '\2022'; color: var(--primary); font-weight: bold; margin-right: 8px; }
    .back-to-top { position:fixed;right:24px;bottom:24px;width:40px;height:40px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9000; }
    .back-to-top.visible { opacity:1;pointer-events:auto; }
    @media(max-width:600px){ .member-grid { columns: 1; } }
  </style>
</head>
<body data-page="committee">
<div id="site-header"></div>
<div id="page-wrapper">
  <div class="page-hero">
    <div class="container">
      <h1>Program Committee</h1>
      <nav class="breadcrumb-nav"><a href="index.html">Home</a> › Committees › Program Committee</nav>
    </div>
  </div>
  <main id="main-content">
    <section>
      <div class="container">
        <h2 class="section-title fade-in">TPC Members</h2>
        <div class="cfp-card fade-in" style="margin-top:24px;">
          <ul class="member-grid" id="memberList">
            <!-- Members will be rendered here by JavaScript -->
          </ul>
        </div>
      </div>
    </section>
  </main>
</div>
<a href="#" class="back-to-top" id="backToTop"><i class="fa fa-chevron-up"></i></a>
<div id="site-footer"></div>
<script src="data/program-committee-data.js"></script>
<script src="js/site.js"></script>
<script>
  function renderCommitteeMembers() {
    const list = document.getElementById('memberList');
    if (!list || !PROGRAM_COMMITTEE_MEMBERS) return;
    
    list.innerHTML = '';
    PROGRAM_COMMITTEE_MEMBERS.forEach(member => {
      const li = document.createElement('li');
      const fullName = member.name + ' ' + member.surname;
      li.textContent = fullName + ', ' + member.affiliation;
      list.appendChild(li);
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    renderCommitteeMembers();
  });

  window.addEventListener('scroll', function () {
    var b = document.getElementById('backToTop');
    if (b) b.classList.toggle('visible', window.scrollY > 300);
  });
</script>
</body>
</html>
